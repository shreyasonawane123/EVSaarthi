# .gitlab-ci.yml
# EV Saarthi — CI/CD Pipeline
# Runs on every push to main or merge request

stages:
  - test
  - build
  - security

# ── Variables ──────────────────────────────────────────────────────────────────
variables:
  NODE_VERSION: "18"

# ── Frontend Test & Build ──────────────────────────────────────────────────────
frontend:test:
  stage: test
  image: node:18-alpine
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - evsaarthi-frontend/node_modules/
  before_script:
    - cd evsaarthi-frontend
    - npm ci
  script:
    - echo "Running frontend lint check..."
    - npx react-scripts test --watchAll=false --passWithNoTests
  only:
    - main
    - merge_requests

frontend:build:
  stage: build
  image: node:18-alpine
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - evsaarthi-frontend/node_modules/
  before_script:
    - cd evsaarthi-frontend
    - npm ci
    - |
      cat > .env << EOF
      REACT_APP_FIREBASE_API_KEY=$REACT_APP_FIREBASE_API_KEY
      REACT_APP_FIREBASE_AUTH_DOMAIN=$REACT_APP_FIREBASE_AUTH_DOMAIN
      REACT_APP_FIREBASE_PROJECT_ID=$REACT_APP_FIREBASE_PROJECT_ID
      REACT_APP_FIREBASE_STORAGE_BUCKET=$REACT_APP_FIREBASE_STORAGE_BUCKET
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID=$REACT_APP_FIREBASE_MESSAGING_SENDER_ID
      REACT_APP_FIREBASE_APP_ID=$REACT_APP_FIREBASE_APP_ID
      REACT_APP_BACKEND_URL=$REACT_APP_BACKEND_URL
      EOF
  script:
    - npm run build
    - echo "Frontend build successful!"
  artifacts:
    paths:
      - evsaarthi-frontend/build/
    expire_in: 1 week
  only:
    - main

# ── Backend Test ───────────────────────────────────────────────────────────────
backend:test:
  stage: test
  image: node:18-alpine
  cache:
    key: backend-$CI_COMMIT_REF_SLUG
    paths:
      - evsaarthi-backend/node_modules/
  before_script:
    - cd evsaarthi-backend
    - npm ci
  script:
    - echo "Checking backend dependencies installed correctly..."
    - node -e "require('express'); require('firebase-admin'); console.log('✅ Backend dependencies OK')"
  only:
    - main
    - merge_requests

# ── Secret Detection (already configured by sir) ──────────────────────────────
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
