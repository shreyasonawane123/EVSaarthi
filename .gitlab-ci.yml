# EV Saarthi — CI/CD Pipeline
# Runs on every push to main or merge request

stages:
  - test
  - build
  - security

# ── Variables ───────────────────────────────────────────────
variables:
  NODE_VERSION: "18"

# ── Frontend Test ───────────────────────────────────────────
frontend:test:
  stage: test
  image: node:18-alpine
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - echo "Running frontend tests..."
    - npx react-scripts test --watchAll=false --passWithNoTests
  only:
    - main
    - merge_requests

# ── Frontend Build ──────────────────────────────────────────
frontend:build:
  stage: build
  image: node:18-alpine
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend/shell-app
    - npm ci
  script:
    - npm run build
    - echo "Frontend build successful!"
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 week
  only:
    - main

# ── Backend Test ────────────────────────────────────────────
backend:test:
  stage: test
  image: node:18-alpine
  cache:
    key: backend-$CI_COMMIT_REF_SLUG
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - npm ci
  script:
    - echo "Checking backend dependencies..."
    - node -e "console.log('Backend CI OK')"
  only:
    - main
    - merge_requests

# ── Secret Detection ────────────────────────────────────────
include:
  - template: Security/Secret-Detection.gitlab-ci.yml